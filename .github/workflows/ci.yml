name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - run: python -m finance_eval run --dataset basic --agent reference --output /tmp/basic.jsonl
      - name: Build source and wheel distributions
        run: python -m build
      - name: Smoke-test the installed wheel outside the checkout
        run: |
          python -m venv /tmp/finance-eval-venv
          /tmp/finance-eval-venv/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/finance-eval-venv/bin/finance-eval run --dataset basic --agent reference --output /tmp/wheel-smoke.jsonl
          /tmp/finance-eval-venv/bin/finance-eval report --input /tmp/wheel-smoke.jsonl
