[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-eval"
version = "0.1.0"
description = "Deterministic evaluation harness for financial agents"
authors = [{ name = "Tanisha Pritha" }]
keywords = ["finance", "accounting", "evaluation", "agents", "benchmark"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Office/Business :: Financial",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/tanishapritha/finance-eval"
Issues = "https://github.com/tanishapritha/finance-eval/issues"

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.0", "ruff>=0.6"]

[project.scripts]
finance-eval = "finance_eval.cli:main"

[tool.setuptools.packages.find]
include = ["finance_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.package-data]
finance_eval = ["data/*.jsonl"]
