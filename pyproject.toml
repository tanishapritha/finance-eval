[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-eval"
version = "0.1.0"
description = "Deterministic evaluation harness for financial agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.0", "ruff>=0.6"]

[project.scripts]
finance-eval = "finance_eval.cli:main"

[tool.setuptools.packages.find]
include = ["finance_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.package-data]
finance_eval = ["data/*.jsonl"]
